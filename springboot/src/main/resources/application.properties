spring.application.name=springboot

# Expose actuator endpoints
management.endpoints.web.exposure.include=health,info,metrics

# OTLP metrics export (Splunk Observability via OpenTelemetry)
management.otlp.metrics.export.url=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
management.otlp.metrics.export.step=30s
management.otlp.metrics.export.resource-attributes.service.name=${spring.application.name}
management.otlp.metrics.export.resource-attributes.deployment.environment=${OTEL_RESOURCE_ATTRIBUTES_ENVIRONMENT:local}
